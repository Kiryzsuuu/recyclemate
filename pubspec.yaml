name: recyclemate
description: Social Marketplace for Upcycled Goods

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.6.0
  http: ^1.2.1         # untuk EmailJS (notifikasi email)
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_storage: ^13.4.2  # untuk upload foto produk

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
